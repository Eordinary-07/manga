<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>Offline Manga Reader</title>
<style>
:root{
  --bg:#0c0c0e; --ink:#16161a; --ink2:#202026; --line:#26262d;
  --text:#ececec; --mute:#85858f; --accent:#ececec; --accent-ink:#0c0c0e; --red:#e5796d;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* buttons */
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:.55rem 1rem;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5}
.icon{background:none;border:0;padding:.55rem .7rem;border-radius:8px;cursor:pointer;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* library */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 16px) 16px 10px}
h1{font-weight:600;font-size:1.35rem;letter-spacing:-.01em;margin:0 0 12px}
#search{width:100%;background:var(--ink);border:0;border-radius:8px;padding:.6rem .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px 12px;padding:8px 16px calc(96px + var(--bot))}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.cover{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:top;border-radius:4px;background:var(--ink2)}
.card .t{margin-top:6px;font-size:.88rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{color:var(--mute);font-size:.75rem;margin-top:2px}
.bar-p{height:2px;background:var(--ink2);margin-top:6px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(16px + var(--bot));z-index:10;width:52px;height:52px;padding:0;border-radius:50%;font-size:1.7rem;line-height:1;display:flex;align-items:center;justify-content:center}
.empty{margin:22vh 24px 0;text-align:center}
.empty .big{font-size:1.1rem;margin:0 0 6px}
.empty p{margin:0 0 16px;color:var(--mute)}

/* series */
.bar{display:flex;align-items:center;padding:calc(var(--top) + 6px) 8px 0}
.hero{display:flex;gap:14px;padding:6px 16px 16px}
.hero img{flex:none;width:88px;aspect-ratio:2/3;object-fit:cover;object-position:top;border-radius:4px;background:var(--ink2)}
.hero h2{font-size:1.15rem;font-weight:600;line-height:1.25;margin:0 0 4px}
.hero p{margin:0 0 12px;color:var(--mute);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chlist{list-style:none;margin:0;padding:0}
.ch{display:flex;align-items:center;border-top:1px solid var(--line)}
.ch .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:13px 16px;cursor:pointer}
.ch .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .stt{display:block;color:var(--mute);font-size:.78rem}
.ch.read .name{color:var(--mute)}
.ch .tog{background:none;border:0;color:var(--mute);padding:13px 16px;cursor:pointer;font-size:.8rem}
.foot{padding:20px 16px calc(28px + var(--bot));border-top:1px solid var(--line)}

/* reader: pages keep their original proportions and are never re-encoded */
#reader{position:fixed;inset:0;z-index:20;background:#000;color:var(--text);user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#stage img{-webkit-touch-callout:none;user-select:none;image-rendering:auto}
#stage.paged{display:flex;align-items:center;justify-content:center;touch-action:pan-y pinch-zoom}
#stage.paged.fit-screen{overflow:hidden}
#stage.paged.fit-screen img{width:100%;height:100%;object-fit:contain}
#stage.paged.fit-width{display:block}
#stage.paged.fit-width img{display:block;width:100%;height:auto}
#stage.scroll .sp{min-height:70vh}
#stage.scroll .sp.loaded{min-height:0}
#stage.scroll img{display:block;width:100%;max-width:900px;height:auto;margin:0 auto}
.endcap{padding:56px 24px calc(64px + var(--bot));text-align:center;color:var(--mute)}
.endcap p{margin:0 0 16px}
.rbar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.88);transition:transform .18s ease}
.rbar.top2{top:0;padding-top:calc(var(--top) + 6px);transform:translateY(-100%)}
.rbar.bot{bottom:0;padding-bottom:calc(var(--bot) + 6px);transform:translateY(100%)}
#reader.ui .rbar{transform:none}
.rbar button{background:none;border:0;padding:.5rem .6rem;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--mute)}
.rtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
#rSlider{flex:1;min-width:0;accent-color:var(--accent)}
#rCount{min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--mute);font-size:.85rem}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--ink);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + var(--bot))}
.sheet h3{font-size:1.1rem;font-weight:600;margin:0 0 12px}
.hint{color:var(--mute);margin:0 0 12px;font-size:.88rem;overflow-wrap:anywhere}
.hint.err{color:var(--red)}
#pwdIn,#mName{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;margin-bottom:12px}
.lbl{display:block;font-size:.8rem;color:var(--mute);margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;padding:.5rem .3rem;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--bot));transform:translateX(-50%);z-index:60;max-width:90%;text-align:center;
  background:var(--ink2);border-radius:8px;padding:.55rem 1rem;font-size:.9rem}
/* selection */
.card,.ch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card{position:relative}
.chk{display:none;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--mute)}
body.selecting .chk{display:block}
.sel .chk{background:var(--accent);border-color:var(--accent)}
.sel .chk::after{content:"\2713";display:block;color:var(--accent-ink);font-size:.8rem;line-height:18px;text-align:center;font-weight:700}
.card .chk{position:absolute;top:6px;right:6px;border-color:#fff;background:rgba(0,0,0,.45)}
.card.sel .chk{background:var(--accent);border-color:var(--accent)}
.card.sel .cover{opacity:.5}
.card.sel .chk::after{content:attr(data-n)}
.mlist{list-style:none;margin:0 0 12px;padding:0}
.mlist li{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist .n{color:var(--mute);min-width:1.8em;font-variant-numeric:tabular-nums}
.mlist .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .chk{margin-left:16px}
.ch.sel{background:var(--ink)}
body.selecting .tog,body.selecting .fab{display:none}
.selbar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:4px;padding:calc(var(--top) + 6px) 8px 6px;background:var(--ink)}
#selCount{flex:1;padding-left:4px}
.icon.danger{color:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="selbar" class="selbar hidden">
  <button class="icon" id="selCancel" aria-label="Cancel">&#10005;</button>
  <span id="selCount">0 selected</span>
  <button class="icon hidden" id="selMerge">Merge</button>
  <button class="icon" id="selAll">All</button>
  <button class="icon danger" id="selDel">Delete</button>
</div>

<main id="library">
  <header class="top">
    <div class="toprow"><h1>Library</h1></div>
    <input id="search" type="search" placeholder="Search" aria-label="Search">
  </header>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    <p class="big">Nothing here yet</p>
    <p>Pick a zip or cbz file to start reading.</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="btnOpenZip">Open zip</button>
    </div>
  </div>
  <button id="fab" class="btn primary fab" aria-label="Open zip">+</button>
</main>

<main id="series" class="hidden">
  <div class="bar"><button class="icon" id="serBack" aria-label="Back to library">‹ Library</button></div>
  <div class="hero">
    <img id="serCover" alt="">
    <div>
      <h2 id="serTitle"></h2>
      <p id="serMeta"></p>
      <div class="row">
        <button class="btn primary" id="serContinue">Start reading</button>
        <button class="btn" id="serSort">Newest first</button>
      </div>
    </div>
  </div>
  <ul id="chList" class="chlist"></ul>
  <div class="foot row">
    <button class="btn" id="serAdd">Add chapters</button>
    <button class="btn danger" id="serDel">Remove from app</button>
  </div>
</main>

<div id="reader" class="hidden">
  <div id="stage"></div>
  <div class="rbar top2">
    <button id="rBack" aria-label="Close reader">‹ Back</button>
    <div class="rtitle" id="rTitle"></div>
    <button id="rOpt">Options</button>
  </div>
  <div class="rbar bot">
    <button id="rPrev" aria-label="Previous chapter">‹ Prev</button>
    <input type="range" id="rSlider" min="1" max="1" value="1" aria-label="Page">
    <span id="rCount">1 / 1</span>
    <button id="rNext" aria-label="Next chapter">Next ›</button>
  </div>
</div>

<div id="rSheet" class="scrim hidden">
  <div class="sheet" role="dialog" aria-label="Reading options">
    <h3>Reading options</h3>
    <div class="lbl">Reading mode</div>
    <div class="seg" data-key="mode">
      <button data-v="rtl">Right to left</button><button data-v="ltr">Left to right</button><button data-v="scroll">Vertical</button>
    </div>
    <div class="lbl">Page size (page modes)</div>
    <div class="seg" data-key="fit">
      <button data-v="screen">Fit screen</button><button data-v="width">Fit width</button>
    </div>
    <button class="btn primary" id="rDone" style="width:100%">Done</button>
  </div>
</div>

<div id="confirm" class="scrim hidden" style="z-index:50">
  <div class="sheet" role="alertdialog" aria-labelledby="cfMsg">
    <p id="cfMsg" style="margin:0 0 16px"></p>
    <div class="row"><button class="btn danger" id="cfOk">Remove</button><button class="btn" id="cfNo">Cancel</button></div>
  </div>
</div>

<div id="mergeSheet" class="scrim hidden" style="z-index:50">
  <div class="sheet" role="dialog" aria-labelledby="mTitle">
    <h3 id="mTitle">Merge into one manga</h3>
    <input id="mName" type="text" placeholder="Name for the combined manga" autocomplete="off" style="margin-bottom:12px">
    <div class="lbl">Chapter order (each selected manga becomes the next chapter)</div>
    <ol id="mList" class="mlist"></ol>
    <label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mKeep"> Keep original chapter names</label>
    <p id="mHint" class="hint err"></p>
    <div class="row"><button class="btn primary" id="mOk">Merge</button><button class="btn" id="mNo">Cancel</button></div>
  </div>
</div>

<div id="pwdSheet" class="scrim hidden" style="z-index:55">
  <div class="sheet" role="dialog" aria-labelledby="pwdMsg">
    <h3>Password needed</h3>
    <p id="pwdMsg" class="hint"></p>
    <input id="pwdIn" type="password" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn primary" id="pwdOk">Unlock</button><button class="btn" id="pwdNo">Skip</button></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<input type="file" id="inZip" class="hidden" multiple accept=".cbz,.zip,application/zip,application/x-zip-compressed,application/octet-stream,application/x-cbz,application/vnd.comicbook+zip">

<script>
'use strict';
const $ = s => document.querySelector(s);
const chSort = (a, b) => (a.order != null && b.order != null) ? a.order - b.order : nat(a.name, b.name);
const nat = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const stripExt = n => n.replace(/\.[^.]+$/, '');
const pref = {
  get(k, d) { try { const v = localStorage.getItem('mr_' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mr_' + k, v); } catch (e) {} }
};
const push = s => { try { history.pushState(s, ''); } catch (e) {} };

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2800);
}

// ZIP-START
const IMG_RE = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const ZIP_RE = /\.(cbz|zip)$/i;
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif', bmp: 'image/bmp' };
const mimeOf = n => MIME[(n.split('.').pop() || '').toLowerCase()] || 'image/jpeg';
const isPageEntry = n => IMG_RE.test(n) && !n.includes('__MACOSX/') && !/(^|\/)\./.test(n);

/* ---- password-protected zips: ZipCrypto and WinZip AES (128/192/256) ---- */
const textEnc = new TextEncoder();
const badPw = () => Object.assign(new Error('wrong password'), { bad: true });
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function zcDecrypt(data, pw, check) {
  const k = [0x12345678, 0x23456789, 0x34567890];
  const upd = b => {
    k[0] = (CRC_T[(k[0] ^ b) & 0xFF] ^ (k[0] >>> 8)) >>> 0;
    k[1] = (Math.imul((k[1] + (k[0] & 0xFF)) >>> 0, 134775813) + 1) >>> 0;
    k[2] = (CRC_T[(k[2] ^ (k[1] >>> 24)) & 0xFF] ^ (k[2] >>> 8)) >>> 0;
  };
  for (const b of pw) upd(b);
  if (data.length < 12) throw badPw();
  const out = new Uint8Array(data.length - 12);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const t = (k[2] | 2) & 0xFFFF;
    const c = data[i] ^ (((t * (t ^ 1)) >>> 8) & 0xFF);
    upd(c);
    if (i < 12) last = c; else out[i - 12] = c;
  }
  if (last !== check) throw badPw();
  return out;
}

const AES = (() => {
  const sb = new Uint8Array(256);
  let p = 1, q = 1;
  const rot = (x, s) => ((x << s) | (x >> (8 - s))) & 0xFF;
  do {
    p = (p ^ (p << 1) ^ (p & 0x80 ? 0x11B : 0)) & 0xFF;
    q ^= q << 1; q ^= q << 2; q ^= q << 4; q &= 0xFF; if (q & 0x80) q ^= 0x09;
    sb[p] = q ^ rot(q, 1) ^ rot(q, 2) ^ rot(q, 3) ^ rot(q, 4) ^ 0x63;
  } while (p !== 1);
  sb[0] = 0x63;
  const t0 = new Uint32Array(256), t1 = new Uint32Array(256), t2 = new Uint32Array(256), t3 = new Uint32Array(256);
  for (let x = 0; x < 256; x++) {
    const s = sb[x], s2 = ((s << 1) ^ (s & 0x80 ? 0x11B : 0)) & 0xFF, s3 = s2 ^ s;
    const w = ((s2 << 24) | (s << 16) | (s << 8) | s3) >>> 0;
    t0[x] = w; t1[x] = ((w >>> 8) | (w << 24)) >>> 0; t2[x] = ((w >>> 16) | (w << 16)) >>> 0; t3[x] = ((w >>> 24) | (w << 8)) >>> 0;
  }
  const sub = t => ((sb[t >>> 24] << 24) | (sb[(t >>> 16) & 255] << 16) | (sb[(t >>> 8) & 255] << 8) | sb[t & 255]) >>> 0;
  function expand(key) {
    const nk = key.length >> 2, nr = nk + 6, n = 4 * (nr + 1), w = new Uint32Array(n);
    for (let i = 0; i < nk; i++) w[i] = ((key[4 * i] << 24) | (key[4 * i + 1] << 16) | (key[4 * i + 2] << 8) | key[4 * i + 3]) >>> 0;
    let rc = 1;
    for (let i = nk; i < n; i++) {
      let t = w[i - 1];
      if (i % nk === 0) { t = sub(((t << 8) | (t >>> 24)) >>> 0) ^ (rc << 24); rc = ((rc << 1) ^ (rc & 0x80 ? 0x11B : 0)) & 0xFF; }
      else if (nk > 6 && i % nk === 4) t = sub(t);
      w[i] = (w[i - nk] ^ t) >>> 0;
    }
    return { w, nr };
  }
  function enc(k, a, b, c, d, out) {
    const w = k.w, nr = k.nr;
    let s0 = (a ^ w[0]) >>> 0, s1 = (b ^ w[1]) >>> 0, s2 = (c ^ w[2]) >>> 0, s3 = (d ^ w[3]) >>> 0, r = 4;
    for (let i = 1; i < nr; i++, r += 4) {
      const u0 = t0[s0 >>> 24] ^ t1[(s1 >>> 16) & 255] ^ t2[(s2 >>> 8) & 255] ^ t3[s3 & 255] ^ w[r];
      const u1 = t0[s1 >>> 24] ^ t1[(s2 >>> 16) & 255] ^ t2[(s3 >>> 8) & 255] ^ t3[s0 & 255] ^ w[r + 1];
      const u2 = t0[s2 >>> 24] ^ t1[(s3 >>> 16) & 255] ^ t2[(s0 >>> 8) & 255] ^ t3[s1 & 255] ^ w[r + 2];
      const u3 = t0[s3 >>> 24] ^ t1[(s0 >>> 16) & 255] ^ t2[(s1 >>> 8) & 255] ^ t3[s2 & 255] ^ w[r + 3];
      s0 = u0 >>> 0; s1 = u1 >>> 0; s2 = u2 >>> 0; s3 = u3 >>> 0;
    }
    out[0] = ((sb[s0 >>> 24] << 24) | (sb[(s1 >>> 16) & 255] << 16) | (sb[(s2 >>> 8) & 255] << 8) | sb[s3 & 255]) ^ w[r];
    out[1] = ((sb[s1 >>> 24] << 24) | (sb[(s2 >>> 16) & 255] << 16) | (sb[(s3 >>> 8) & 255] << 8) | sb[s0 & 255]) ^ w[r + 1];
    out[2] = ((sb[s2 >>> 24] << 24) | (sb[(s3 >>> 16) & 255] << 16) | (sb[(s0 >>> 8) & 255] << 8) | sb[s1 & 255]) ^ w[r + 2];
    out[3] = ((sb[s3 >>> 24] << 24) | (sb[(s0 >>> 16) & 255] << 16) | (sb[(s1 >>> 8) & 255] << 8) | sb[s2 & 255]) ^ w[r + 3];
  }
  // WinZip AES uses CTR mode with a little-endian counter that starts at 1.
  function ctrLE(key, data) {
    const k = expand(key), out = new Uint8Array(data.length), ks = new Uint32Array(4);
    for (let off = 0, n = 1; off < data.length; off += 16, n++) {
      enc(k, (((n & 255) << 24) | (((n >>> 8) & 255) << 16) | (((n >>> 16) & 255) << 8) | ((n >>> 24) & 255)) >>> 0, 0, 0, 0, ks);
      const m = Math.min(16, data.length - off);
      for (let j = 0; j < m; j++) out[off + j] = data[off + j] ^ ((ks[j >> 2] >>> (24 - 8 * (j & 3))) & 255);
    }
    return out;
  }
  return { ctrLE, expand, enc };
})();

async function aesEntry(data, aes, pw) {
  const saltLen = [8, 12, 16][aes.strength - 1], keyLen = [16, 24, 32][aes.strength - 1];
  if (!saltLen) throw new Error('unsupported encryption');
  const salt = data.subarray(0, saltLen), ver = data.subarray(saltLen, saltLen + 2);
  const body = data.subarray(saltLen + 2, data.length - 10);
  const base = await crypto.subtle.importKey('raw', textEnc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 1000, hash: 'SHA-1' }, base, (2 * keyLen + 2) * 8));
  if (bits[2 * keyLen] !== ver[0] || bits[2 * keyLen + 1] !== ver[1]) throw badPw();
  return AES.ctrLE(bits.subarray(0, keyLen), body);
}

async function readZip(file) {
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a valid zip/cbz file');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  if (count === 0xFFFF || p === 0xFFFFFFFF) throw new Error('ZIP64 archives are not supported');
  const entries = [], dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const flag = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const time = dv.getUint16(p + 12, true), crc = dv.getUint32(p + 16, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    let aes = null;
    for (let x = p + 46 + nlen, end = x + elen; x + 4 <= end; x += 4 + dv.getUint16(x + 2, true)) {
      if (dv.getUint16(x, true) === 0x9901) aes = { strength: dv.getUint8(x + 8), method: dv.getUint16(x + 9, true) };
    }
    entries.push({ name: dec.decode(u8.subarray(p + 46, p + 46 + nlen)), method, csize, lho, flag, time, crc, aes, enc: (flag & 1) !== 0 });
    p += 46 + nlen + elen + clen;
  }
  return { dv, u8, entries };
}
async function zipEntryBlob(z, e, pw) {
  const nlen = z.dv.getUint16(e.lho + 26, true), elen = z.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  let data = z.u8.subarray(start, start + e.csize), method = e.method;
  const type = mimeOf(e.name);
  const zipCrypto = e.enc && !e.aes;
  if (e.enc) {
    if (e.flag & 0x40) throw new Error('unsupported encryption');
    if (!pw) throw badPw();
    if (e.aes) { data = await aesEntry(data, e.aes, pw); method = e.aes.method; }
    else if (method === 99) throw new Error('unsupported encryption');
    else data = zcDecrypt(data, textEnc.encode(pw), (e.flag & 8) ? (e.time >> 8) & 255 : e.crc >>> 24);
  }
  let out;
  if (method === 0) out = data;
  else if (method === 8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('this WebView is too old, update Android System WebView');
    try {
      out = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } catch (err) { if (e.enc) throw badPw(); throw err; }
  } else throw new Error('unsupported compression method');
  if (zipCrypto && crc32(out) !== e.crc) throw badPw();
  return new Blob([out], { type });
}
// ZIP-END

/* ---------- storage (IndexedDB) ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('offline-manga', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('series', { keyPath: 'id' });
      d.createObjectStore('chapters', { keyPath: 'id' }).createIndex('series', 'seriesId');
      d.createObjectStore('pages', { keyPath: 'id' });

    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const st = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);

const del = (n, k) => req(st(n, 'readwrite').delete(k));
const chaptersOf = id => req(st('chapters').index('series').getAll(id));

async function makeThumb(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const w = Math.min(480, bmp.width), h = Math.max(1, Math.round(bmp.height * w / bmp.width));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return await new Promise(r => c.toBlob(b => r(b || blob), 'image/png'));
  } catch (e) { return blob; }
}

function askPassword(name, wrong) {
  return new Promise(res => {
    const el = $('#pwdSheet'), inp = $('#pwdIn'), msg = $('#pwdMsg');
    msg.textContent = wrong ? 'Wrong password. Try again.' : '\u201c' + name + '\u201d is password protected.';
    msg.classList.toggle('err', !!wrong);
    inp.value = ''; el.classList.remove('hidden'); setTimeout(() => inp.focus(), 60);
    const done = v => { el.classList.add('hidden'); inp.onkeydown = null; res(v); };
    $('#pwdOk').onclick = () => done(inp.value);
    $('#pwdNo').onclick = () => done(null);

  });
}
async function unlockZip(z, entry, name, state) {
  const works = async pw => { try { await zipEntryBlob(z, entry, pw); return true; } catch (err) { if (err.bad) return false; throw err; } };
  if (state.pw && await works(state.pw)) return state.pw;
  let wrong = false;
  for (;;) {
    const pw = await askPassword(name, wrong);
    if (pw === null) throw Object.assign(new Error('password not entered'), { cancelled: true });
    if (pw && await works(pw)) { state.pw = pw; return pw; }
    wrong = true;
  }
}

/* ---------- import ---------- */
let importing = false;
let pendingTitle = '';
function pickZip(title) { pendingTitle = title || ''; $('#inZip').click(); }
async function runImport(files, forcedTitle) {
  if (importing) return;
  const title = forcedTitle || '';
  const status = t => toast(t);
  const groups = new Map(); let unsupported = 0;
  for (const f of files) {
    const rel = f.webkitRelativePath || '';
    const parts = rel ? rel.split('/') : [f.name];
    const base = parts[parts.length - 1], dirs = parts.slice(0, -1);
    if (!ZIP_RE.test(base)) { if (/\.(cbr|rar|7z|cb7)$/i.test(base)) unsupported++; continue; }
    const chain = [...dirs, stripExt(base)];
    let series, chapter;
    if (chain.length === 1) { series = title || chain[0]; chapter = chain[0]; }
    else if (chain.length === 2) { series = title || chain[0]; chapter = chain[1]; }
    else { series = chain[1]; chapter = chain.slice(2).join(' / '); }
    if (!groups.has(series)) groups.set(series, new Map());
    const cm = groups.get(series), key = chapter || '';
    if (!cm.has(key)) cm.set(key, { name: chapter, zips: [], imgs: [] });
    const g = cm.get(key);
    g.zips.push(f);
  }
  if (!groups.size) {
    status(unsupported ? 'CBR and RAR files are not supported. Convert them to CBZ first.' : 'This file is not supported.');
    return;
  }
  importing = true;
  let added = 0, skipped = 0, openTarget = null;
  const unlock = { pw: null };
  try {
    const all = await req(st('series').getAll());
    for (const [sname, cm] of groups) {
      let s = all.find(x => x.title.toLowerCase() === sname.toLowerCase());
      const existing = s ? await chaptersOf(s.id) : [];
      const have = new Set(existing.map(c => c.name.toLowerCase()));
      let count = existing.length, changed = false;
      const ordered = existing.some(c => c.order != null);
      let nextOrder = existing.reduce((m, c) => Math.max(m, c.order || 0), 0);
      if (!s) { s = { id: uid(), title: sname, cover: null, added: Date.now(), lastRead: 0, lastChapterId: null }; all.push(s); }
      const list = [...cm.values()].sort((a, b) => nat(a.name || '', b.name || ''));
      for (const g of list) {
        const name = g.name || ('Chapter ' + (count + 1));
        if (have.has(name.toLowerCase())) {
          const ex = existing.find(c => c.name.toLowerCase() === name.toLowerCase());
          if (ex && !openTarget) openTarget = { sid: s.id, cid: ex.id };
          continue;
        }
        status('Unpacking ' + name);
        let blobs = [];
        try {
          if (g.zips.length) {
            const z = await readZip(g.zips[0]);
            const es = z.entries.filter(e => isPageEntry(e.name)).sort((a, b) => nat(a.name, b.name));
            let pw = null;
            const locked = es.find(e => e.enc);
            if (locked) pw = await unlockZip(z, locked, g.zips[0].name, unlock);
            for (const e of es) blobs.push(await zipEntryBlob(z, e, pw));
          } else {
            g.imgs.sort((a, b) => nat(a.path, b.path));
            blobs = g.imgs.map(x => x.f.slice(0, x.f.size, mimeOf(x.f.name)));
          }
        } catch (err) {
          console.error(err);
          toast(err.cancelled ? 'Password not entered' : 'This zip file is not supported');
          skipped++; continue;
        }
        if (!blobs.length) { toast('This zip file is not supported'); skipped++; continue; }
        const ch = { id: uid(), seriesId: s.id, name, pageCount: blobs.length, read: false, lastPage: 0 };
        if (ordered) ch.order = ++nextOrder;
        await put('pages', { id: ch.id, blobs });
        await put('chapters', ch);
        have.add(name.toLowerCase()); count++; added++; changed = true;
        if (!openTarget) openTarget = { sid: s.id, cid: ch.id };
        if (!s.cover) s.cover = await makeThumb(blobs[0]);
      }
      if (changed) await put('series', s);
    }
  } catch (err) {
    console.error(err); status('Import stopped. The phone may be out of storage.');
  }
  importing = false;
  await renderLibrary();
  if (openTarget) await openChapter(openTarget.sid, openTarget.cid);
}

const SEL = { on: false, scope: '', ids: new Set(), popping: false };

function leaveSel(steps) {

function addLongPress(container, selector, scope) {
  let timer = 0, sx = 0, sy = 0, fired = false;
  const cancel = () => clearTimeout(timer);
  container.addEventListener('pointerdown', e => {
    const el = e.target.closest(selector); if (!el || SEL.on) return;
    fired = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { fired = true; selStart(scope, el.dataset.sid); if (navigator.vibrate) navigator.vibrate(15); }, 450);
  });
  container.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => container.addEventListener(t, cancel));
  container.addEventListener('click', e => { if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  container.addEventListener('contextmenu', e => { if (e.target.closest(selector)) e.preventDefault(); });
}
async function deleteSelected() {
  const ids = [...SEL.ids], n = ids.length, lib = SEL.scope === 'lib';
  if (!n) return;
  const msg = lib
    ? 'Delete ' + n + ' manga and all their chapters from this app? Your original files are not touched.'
    : 'Delete ' + n + (n === 1 ? ' chapter' : ' chapters') + ' from this app? Your original files are not touched.';
  if (!(await askConfirm(msg, 'Delete'))) return;
  if (lib) {
    for (const id of ids) await deleteSeries(id);
    leaveSel(1); await renderLibrary();
  } else {
    for (const id of ids) { await del('pages', id); await del('chapters', id); }
    const sid = S.series && S.series.id;
    const left = sid ? await chaptersOf(sid) : [];
    if (sid && !left.length) {
      await del('series', sid); S.series = null; S.chapters = [];
      if (!leaveSel(2)) { SEL.popping = true; history.back(); }
      showView('library'); await renderLibrary();
    } else {
      leaveSel(1);
      if (sid) { await loadSeries(sid); renderSeries(); }
    }
  }
  toast('Deleted');
}

/* ---------- merge several manga into one, in the order selected ---------- */
const MG = { order: [], titles: new Map() };
async function mergeSeries(ids, title, keepNames) {
  const all = await req(st('series').getAll());
  const srcs = ids.map(id => all.find(s => s.id === id)).filter(Boolean);
  if (srcs.length < 2) return 'Select at least two manga';
  const clash = all.find(s => !ids.includes(s.id) && s.title.toLowerCase() === title.toLowerCase());
  if (clash) return 'A manga named \u201c' + clash.title + '\u201d already exists';
  const m = { id: uid(), title, cover: null, added: Date.now(), lastRead: 0, lastChapterId: null };
  for (const s of srcs) {
    if (!m.cover && s.cover) m.cover = s.cover;
    if ((s.lastRead || 0) > m.lastRead) { m.lastRead = s.lastRead; m.lastChapterId = s.lastChapterId; }
  }
  await put('series', m);
  let n = 0;
  for (const s of srcs) {
    for (const c of (await chaptersOf(s.id)).sort(chSort)) {
      n++; c.seriesId = m.id; c.order = n;
      if (!keepNames) c.name = 'Chapter ' + n;

}

  await put('chapters', ch); await put('series', S.series);
}

async function startReading(chId) {
  const ch = S.chapters.find(c => c.id === chId); if (!ch) return;
  R.list = S.chapters;
  $('#reader').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  push({ v: 'reader' });
  await loadChapter(ch, ch.read ? 0 : (ch.lastPage || 0));
  showUI(true);
}
async function loadChapter(ch, start) {
  await flushSave();
  const rec = await req(st('pages').get(ch.id));
  if (!rec || !rec.blobs.length) { toast('This chapter has no pages'); return; }
  freeUrls();
  R.ch = ch; R.idx = R.list.findIndex(c => c.id === ch.id); R.blobs = rec.blobs;
  const n = R.blobs.length;
  R.page = start === 'last' ? n - 1 : Math.min(Math.max(0, start | 0), n - 1);
  $('#rTitle').textContent = S.series.title + (ch.name === S.series.title ? '' : ': ' + ch.name);
  buildStage();
}
function updateCount() {
  $('#rCount').textContent = (R.page + 1) + ' / ' + R.blobs.length;
  $('#rSlider').value = R.page + 1;
}
function loadScrollImg(el) {
  if (!el || el.firstChild) return;
  const img = new Image(); img.alt = ''; img.decoding = 'async';
  img.onload = () => el.classList.add('loaded');
  img.src = urlOf(+el.dataset.i); el.appendChild(img);
}
function buildStage() {
  const stage = $('#stage'), n = R.blobs.length;
  if (R.io) { R.io.disconnect(); R.io = null; }
  stage.innerHTML = '';
  const sl = $('#rSlider'); sl.max = n; sl.value = R.page + 1;
  sl.style.direction = R.mode === 'rtl' ? 'rtl' : 'ltr';
  if (R.mode === 'scroll') {
    stage.className = 'scroll'; R.els = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div'); d.className = 'sp'; d.dataset.i = i;
      stage.appendChild(d); R.els.push(d);
    }
    const end = document.createElement('div'); end.className = 'endcap';
    const hasNext = R.idx < R.list.length - 1;
    end.innerHTML = '<p></p>';
    end.firstChild.textContent = hasNext ? 'End of ' + R.ch.name : 'End of the last chapter';
    if (hasNext) {
      const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = 'Next chapter';
      b.onclick = () => stepChapter(1); end.appendChild(b);
    }
    stage.appendChild(end);
    R.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) loadScrollImg(e.target); }),
      { root: stage, rootMargin: '1800px 0px' });
    for (let j = Math.max(0, R.page - 1); j <= Math.min(n - 1, R.page + 1); j++) loadScrollImg(R.els[j]);
    requestAnimationFrame(() => { R.els[R.page].scrollIntoView({ block: 'start' }); R.els.forEach(el => R.io.observe(el)); });
  } else {
    stage.className = 'paged fit-' + R.fit;
    const img = document.createElement('img'); img.id = 'pg'; img.alt = ''; img.draggable = false;
    stage.appendChild(img); showPage(R.page);
  }
  updateCount();
}
function showPage(i) {
  R.page = i;
  $('#pg').src = urlOf(i); $('#stage').scrollTop = 0;
  [i + 1, i - 1, i + 2].forEach(j => { if (j >= 0 && j < R.blobs.length) { new Image().src = urlOf(j); } });
  updateCount(); saveProgress();
}
function onScroll() {
  if (R.mode !== 'scroll' || R.raf) return;
  R.raf = requestAnimationFrame(() => {
    R.raf = 0;
    const stage = $('#stage'), y = stage.scrollTop + stage.clientHeight * 0.35;
    let lo = 0, hi = R.els.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (R.els[mid].offsetTop <= y) lo = mid; else hi = mid - 1; }
    let p = lo;
    if (stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 6) p = R.els.length - 1;
    if (p !== R.page) { R.page = p; updateCount(); saveProgress(); }
  });
}
function goNext() {
  if (R.mode === 'scroll') { $('#stage').scrollBy({ top: innerHeight * 0.85, behavior: 'smooth' }); return; }
  if (R.page < R.blobs.length - 1) showPage(R.page + 1); else stepChapter(1);
}
function goPrev() {
  if (R.mode === 'scroll') { $('#stage').scrollBy({ top: -innerHeight * 0.85, behavior: 'smooth' }); return; }
  if (R.page > 0) showPage(R.page - 1); else stepChapter(-1, true);
}
async function stepChapter(d, toLast) {
  const t = R.list[R.idx + d];
  if (!t) { toast(d > 0 ? 'That was the last chapter' : 'This is the first chapter'); return; }
  if (d > 0) { R.ch.read = true; await put('chapters', R.ch); }
  await loadChapter(t, d < 0 && toLast ? 'last' : 0);
}
async function teardownReader() {
  await flushSave();
  if (R.io) { R.io.disconnect(); R.io = null; }
  freeUrls(); R.ch = null; R.blobs = []; R.els = [];
  $('#stage').innerHTML = ''; hideUI();
  $('#reader').classList.add('hidden'); document.body.style.overflow = '';
}
function tap(x) {
  if (uiVisible()) { hideUI(); return; }
  if (R.mode === 'scroll') { showUI(); return; }
  const z = x / innerWidth;
  if (z < 0.3) (R.mode === 'rtl' ? goNext : goPrev)();
  else if (z > 0.7) (R.mode === 'rtl' ? goPrev : goNext)();
  else showUI();
}
function syncOptions() {
  document.querySelectorAll('#rSheet .seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === R[seg.dataset.key]));
  });
}

/* ---------- wiring ---------- */
function bind() {
  $('#search').addEventListener('input', renderLibrary);

  addLongPress($('#grid'), '.card', 'lib');
  addLongPress($('#chList'), '.ch', 'ser');
  $('#selCancel').onclick = () => leaveSel(1);
  $('#selAll').onclick = () => {
    const sel = SEL.scope === 'lib' ? '#grid [data-sid]' : '#chList [data-sid]';
    document.querySelectorAll(sel).forEach(el => SEL.ids.add(el.dataset.sid)); selUpdate();
  };
  $('#selDel').onclick = deleteSelected;
  $('#selMerge').onclick = openMerge;
  $('#mNo').onclick = hideMerge;
  $('#mOk').onclick = async () => {
    const title = $('#mName').value.trim(), hint = $('#mHint');
    if (!title) { hint.textContent = 'Enter a name first.'; return; }
    $('#mOk').disabled = true;
    try {
      const err = await mergeSeries(MG.order, title, $('#mKeep').checked);
      if (err) { hint.textContent = err; return; }
    } catch (e) {
      console.error(e); hint.textContent = 'Merge failed. The phone may be out of storage.'; return;
    } finally { $('#mOk').disabled = false; }
    const n = MG.order.length;
    hideMerge(); leaveSel(1); await renderLibrary(); toast('Merged ' + n + ' manga');
  };
  $('#fab').onclick = () => pickZip('');
  $('#btnOpenZip').onclick = () => pickZip('');
  $('#inZip').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    const t = pendingTitle; pendingTitle = '';
    if (files.length) await runImport(files, t);
  });

  $('#serBack').onclick = () => history.back();
  $('#serContinue').onclick = () => { const t = continueTarget(); if (t) startReading(t.ch.id); };
  $('#serSort').onclick = () => { pref.set('desc', pref.get('desc', '1') === '1' ? '0' : '1'); renderSeries(); };
  $('#serAdd').onclick = () => pickZip(S.series.title);
  $('#serDel').onclick = async () => {
    const n = S.chapters.length;
    const ok = await askConfirm('Remove "' + S.series.title + '" and its ' + n + (n === 1 ? ' chapter' : ' chapters') +
      ' from this app? Your original files on the phone are not touched.', 'Remove');
    if (!ok) return;
    await deleteSeries(S.series.id); S.series = null; S.chapters = [];
    toast('Removed from the app');
    if (history.state && history.state.v === 'series') history.back(); else { showView('library'); renderLibrary(); }
  };

  const stage = $('#stage'); let pd = null;
  stage.addEventListener('scroll', onScroll, { passive: true });
  stage.addEventListener('pointerdown', e => { if (e.isPrimary) pd = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  stage.addEventListener('pointercancel', () => { pd = null; });
  stage.addEventListener('pointerup', e => {
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y, dt = Date.now() - pd.t; pd = null;
    if (window.visualViewport && window.visualViewport.scale > 1.05) return;
    if (R.mode !== 'scroll' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      const forward = R.mode === 'rtl' ? dx > 0 : dx < 0;
      forward ? goNext() : goPrev(); return;
    }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 600) tap(e.clientX);
  });
  $('#rBack').onclick = () => history.back();
  $('#rPrev').onclick = () => stepChapter(-1);
  $('#rNext').onclick = () => stepChapter(1);
  $('#rOpt').onclick = () => { syncOptions(); openSheet($('#rSheet')); };
  $('#rDone').onclick = closeSheet;
  $('#rSheet').addEventListener('click', e => { if (e.target.id === 'rSheet') closeSheet(); });
  document.querySelectorAll('#rSheet .seg button').forEach(b => b.onclick = () => {
    const key = b.parentElement.dataset.key; R[key] = b.dataset.v; pref.set(key, R[key]);
    syncOptions(); if (R.ch) buildStage();
  });
  $('#rSlider').addEventListener('input', e => {
    const p = +e.target.value - 1;
    if (R.mode === 'scroll') {
      for (let j = Math.max(0, p - 1); j <= Math.min(R.els.length - 1, p + 1); j++) loadScrollImg(R.els[j]);
      R.page = p; R.els[p].scrollIntoView({ block: 'start' }); updateCount(); saveProgress();
    } else showPage(p);
  });

  addEventListener('keydown', e => {
    if ($('#reader').classList.contains('hidden') || sheetOpen) return;
    if (e.key === 'Escape') { history.back(); return; }
    if (R.mode === 'scroll') return;
    if (e.key === 'ArrowRight') (R.mode === 'rtl' ? goPrev : goNext)();
    else if (e.key === 'ArrowLeft') (R.mode === 'rtl' ? goNext : goPrev)();
    else if (e.key === ' ') { e.preventDefault(); goNext(); }
  });

  addEventListener('popstate', async e => {
    if (SEL.popping) { SEL.popping = false; return; }
    if (!$('#mergeSheet').classList.contains('hidden')) { hideMerge(); push({ v: 'sel' }); return; }
    if (SEL.on) { SEL.on = false; SEL.ids.clear(); selUpdate(); return; }
    if (sheetOpen) { hideSheet(); return; }
    const s = e.state;
    if (!$('#reader').classList.contains('hidden')) await teardownReader();
    if (s && (s.v === 'series' || s.v === 'reader') && S.series) await openSeries(S.series.id, false);
    else { showView('library'); await renderLibrary(); }
  });
}

(async function init() {
  try { db = await openDB(); }
  catch (e) {
    document.body.innerHTML = '<p style="padding:24px">Storage is not available in this app. Turn on DOM storage and IndexedDB in the Android WebView settings.</p>';
    return;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  try { history.replaceState(null, ''); } catch (e) {}
  bind(); await renderLibrary();
  openSharedZip();
})();
</script>
</body>
